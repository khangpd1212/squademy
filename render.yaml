# Render Blueprint — Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: squademy-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/version
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: squademy-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://squademy-web.vercel.app

databases:
  - name: squademy-db
    databaseName: squademy
    plan: free
